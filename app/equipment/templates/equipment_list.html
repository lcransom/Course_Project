<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipment</title>
</head>
<body>
    <h1>Gym Equipment</h1>
    <p><a href="{{ url_for('index') }}">Home</a></p>
        <form method="get" action="{{ url_for('equipment.list_equipment') }}">
        <label for="category">Filter by category:</label>
        <input
            type="text"
            id="category"
            name="category"
            value="{{ request.args.get('category', '') }}"
        >
        <label for="sort_by">Sort by:</label>
        <select id="sort_by" name="sort_by">
            <option value="name" {% if request.args.get('sort_by', 'name') == 'name' %}selected{% endif %}>Name</option>
            <option value="category" {% if request.args.get('sort_by') == 'category' %}selected{% endif %}>Category</option>
            <option value="target_muscle_focus" {% if request.args.get('sort_by') == 'target_muscle_focus' %}selected{% endif %}>Target Muscle Focus</option>
        </select>

        <label for="sort_order">Order:</label>
        <select id="sort_order" name="sort_order">
            <option value="asc" {% if request.args.get('sort_order', 'asc') == 'asc' %}selected{% endif %}>Ascending (A to Z)</option>
            <option value="desc" {% if request.args.get('sort_order') == 'desc' %}selected{% endif %}>Descending (Z to A)</option>
        </select>
        <label for="limit">Maximum results:</label>
        <input
            type="number"
            id="limit"
            name="limit"
            min="1"
            value="{{ request.args.get('limit', '') }}"
        >
        <button type="submit">Filter</button>
    </form>
    {% if error_message %}
        <p role="alert">{{ error_message }}</p>
    {% elif equipment %}
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Target Muscle Focus</th>
                </tr>
            </thead>
            <tbody>
                {% for item in equipment %}
                    <tr>
                        <td>{{ item.name }}</td>
                        <td>{{ item.category }}</td>
                        <td>{{ item.target_muscle_focus }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No equipment has been added yet.</p>
    {% endif %}
</body>
</html>
