<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Equipment</title>
</head>
<body>
    <h1>Gym Equipment</h1>
    {% if error_message %}
        <p style="color: red;">{{ error_message }}</p>
    {% elif equipment %}
        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Target Muscle Focus</th>
                </tr>
            </thead>
            <tbody>
                {% for item in equipment %}
                    <tr>
                        <td>{{ item.name }}</td>
                        <td>{{ item.category }}</td>
                        <td>{{ item.target_muscle_focus }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No equipment has been added yet.</p>
    {% endif %}
</body>
</html>
